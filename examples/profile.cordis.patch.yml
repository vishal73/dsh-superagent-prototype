# Example profile configuration ($DSH_HOME/profiles/<profile>/cordis.patch.yml).
# Replace <placeholders> before first start; see docs/006-deployment.md.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-superagent
  config:
    stateDir: <absolute path, for example /home/me/.dsh/state/superagent>
# Telegram is optional: uncomment to enable its Source, and start the profile with TELEGRAM_BOT_TOKEN in its environment.
# - id: dsh-superagent-telegram
#   disabled: false
